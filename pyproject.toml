[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "conduit"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["mcp>=1.28,<2",]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "api*",
    "agents*",
    "core*",
    "database*",
    "guardrails*",
    "llm*",
    "models*",
    "mcp_servers*",
    "orchestration*",
    "rag*",
    "services*",
]