[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "conduit"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.115,<1",
    "langchain>=1.0,<2",
    "langchain-mcp-adapters>=0.1,<1",
    "langgraph>=1.0,<2",
    "mcp[cli]>=1.28,<2",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy>=2.1.1",
    "uvicorn[standard]>=0.34,<1",
    "langgraph-checkpoint-postgres>=2.0,<4",
    "langchain-openai>=1.0,<2",
    "httpx>=0.28,<1"
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "api*",
    "agents*",
    "core*",
    "database*",
    "exceptions*",
    "guardrails*",
    "llm*",
    "models*",
    "mcp_servers*",
    "orchestration*",
    "rag*",
    "services*",
]
