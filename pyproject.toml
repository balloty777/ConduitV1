[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "conduit"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.0",
    "mcp[cli]>=1.28,<2",
    "psycopg[binary]>=3.3.6",
    "sqlalchemy>=2.1.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "api*",
    "agents*",
    "core*",
    "database*",
    "exceptions*",
    "guardrails*",
    "llm*",
    "models*",
    "mcp_servers*",
    "orchestration*",
    "rag*",
    "services*",
]
